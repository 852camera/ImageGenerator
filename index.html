<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo & Video Watermark Studio Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        studio: {
                            bg: '#0F1117',
                            card: '#1A1D26',
                            border: '#2A2E3D',
                            accent: '#3B82F6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: #0F1117; 
            color: #E5E7EB;
        }

        /* Canvas Background Checkerboard */
        .canvas-viewport {
            background-color: #181B22;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 20px 20px;
            background-position: -10px -10px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0F1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2E3D;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B4054;
        }

        .studio-card {
            background: rgba(26, 29, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .studio-input {
            background: rgba(15, 17, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.15s ease-in-out;
        }
        .studio-input:focus {
            border-color: #3B82F6;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Canvas Rounded Rectangle Helper
        const drawRoundedRect = (ctx, x, y, width, height, radius) => {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r);
            ctx.lineTo(x + width, y + height - r);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            ctx.lineTo(x + r, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        };

        const App = () => {
            // Media States
            const [imageObj, setImageObj] = useState(null);
            const [mediaType, setMediaType] = useState('image');
            const [logoObj, setLogoObj] = useState(null);
            const [seatingPlanObj, setSeatingPlanObj] = useState(null);
            const [seatingPlanSrc, setSeatingPlanSrc] = useState(null);
            const [imageSrc, setImageSrc] = useState(null);
            
            // Interactive States
            const [pinPosition, setPinPosition] = useState(null);
            const [mainImagePin, setMainImagePin] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const [recordingProgress, setRecordingProgress] = useState(0);
            const [copied, setCopied] = useState(false);
            const [showSafeZone, setShowSafeZone] = useState(false);
            
            // Customization Options
            const [outputSize, setOutputSize] = useState('ig');
            const [backgroundStyle, setBackgroundStyle] = useState('blur'); // 'blur', 'dark', 'white'
            const [fontFamily, setFontFamily] = useState("'Noto Sans TC', sans-serif");
            const [fontScale, setFontScale] = useState(1);
            const [logoPosition, setLogoPosition] = useState('top-right');
            const barColorStart = '#102e5a'; // Symphonic Blue
            
            // Sharpness Zoom States
            const [enableZoom, setEnableZoom] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(2); 
            const [zoomPosition, setZoomPosition] = useState('top-left');
            const [zoomSize, setZoomSize] = useState(0.24); 

            // Standalone Floating QR Code States
            const [enableQr, setEnableQr] = useState(true);
            const [qrUrl, setQrUrl] = useState('https://example.com/rental');
            const [qrText, setQrText] = useState('立刻租借');
            const [qrPosition, setQrPosition] = useState('top-right');
            const [qrSize, setQrSize] = useState(0.14); 
            const [qrObj, setQrObj] = useState(null);

            // Watermark Content
            const [eventName, setEventName] = useState('2026 KISS OF LIFE ASIA FANMEETING TOUR <DEJA VU> IN TAIPEI');
            const [camera, setCamera] = useState('Canon R7');
            const [lens, setLens] = useState('RF100500');
            const [venue, setVenue] = useState('Kai Tak Arena');
            const [seating, setSeating] = useState('Block A Row C');
            const [optionalText, setOptionalText] = useState('');

            const canvasRef = useRef(null);
            const animationRef = useRef(null);

            // Load default logo on init
            useEffect(() => {
                const img = new Image();
                img.onload = () => setLogoObj(img);
                img.onerror = () => console.log('Default logo.jpg not present.');
                img.src = 'logo.jpg'; 
            }, []);

            // Generate QR Code Image Object
            useEffect(() => {
                if (!enableQr || !qrUrl) {
                    setQrObj(null);
                    return;
                }
                try {
                    const qr = new QRious({
                        value: qrUrl,
                        size: 300,
                        level: 'H'
                    });
                    const img = new Image();
                    img.onload = () => setQrObj(img);
                    img.src = qr.toDataURL();
                } catch (err) {
                    console.error("QR Code Error:", err);
                }
            }, [enableQr, qrUrl]);

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => setLogoObj(img);
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleMediaUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (imageSrc) URL.revokeObjectURL(imageSrc);

                if (imageObj && imageObj.tagName === 'VIDEO') {
                    imageObj.pause();
                    imageObj.src = '';
                    imageObj.load();
                    imageObj.remove();
                }

                const isVid = file.type.startsWith('video/');
                setMediaType(isVid ? 'video' : 'image');
                const url = URL.createObjectURL(file);
                setImageSrc(url);

                if (isVid) {
                    const vid = document.createElement('video');
                    vid.src = url;
                    vid.muted = true;
                    vid.loop = true;
                    vid.playsInline = true;
                    vid.crossOrigin = "anonymous";
                    vid.style.display = 'none';
                    document.body.appendChild(vid);
                    
                    vid.onloadeddata = () => {
                        setImageObj(vid);
                        vid.play();
                    };
                } else {
                    const img = new Image();
                    img.onload = () => setImageObj(img);
                    img.src = url;
                }
            };

            const handleSeatingPlanUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setSeatingPlanSrc(event.target.result);
                        const img = new Image();
                        img.onload = () => setSeatingPlanObj(img);
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSeatingPlanClick = (e) => {
                const rect = e.target.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                setPinPosition({ x, y });
            };

            const clearSeatingPlan = () => {
                setSeatingPlanObj(null);
                setSeatingPlanSrc(null);
                setPinPosition(null);
            };

            const handleCanvasClick = (e) => {
                if (!canvasRef.current || !imageObj || !enableZoom) return;

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
                const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

                const mWidth = imageObj.videoWidth || imageObj.width;
                const mHeight = imageObj.videoHeight || imageObj.height;

                let imgX = 0, imgY = 0, imgW = canvas.width, imgH = canvas.height;

                if (outputSize === 'ig' || outputSize === 'ig-reel') {
                    const scaleFit = Math.min(canvas.width / mWidth, canvas.height / mHeight);
                    imgW = mWidth * scaleFit;
                    imgH = mHeight * scaleFit;
                    imgX = (canvas.width - imgW) / 2;
                    imgY = (canvas.height - imgH) / 2;
                }

                if (clickX >= imgX && clickX <= imgX + imgW && clickY >= imgY && clickY <= imgY + imgH) {
                    const relativeX = (clickX - imgX) / imgW;
                    const relativeY = (clickY - imgY) / imgH;
                    setMainImagePin({ x: relativeX, y: relativeY });
                }
            };

            const hexToRgba = (hex, alpha) => {
                let c = hex.replace('#', '');
                if (c.length === 3) c = c.split('').map(x => x + x).join('');
                const num = parseInt(c, 16);
                return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
            };

            // Master Canvas Render Engine
            const renderCanvas = useCallback(() => {
                if (!imageObj || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                const mWidth = imageObj.videoWidth || imageObj.width;
                const mHeight = imageObj.videoHeight || imageObj.height;
                if (!mWidth || !mHeight) return;

                let w, h;
                let imgX = 0, imgY = 0, imgW, imgH;

                // 1. Calculate Canvas Aspect Ratio
                if (outputSize === 'ig') {
                    const targetRatio = 4 / 5;
                    const imgRatio = mWidth / mHeight;
                    let cw = imgRatio > targetRatio ? mWidth : mHeight * targetRatio;
                    let ch = imgRatio > targetRatio ? mWidth / targetRatio : mHeight;

                    canvas.width = Math.max(1080, Math.round(cw));
                    canvas.height = Math.max(1350, Math.round(ch));
                } else if (outputSize === 'ig-reel') {
                    const targetRatio = 9 / 16;
                    const imgRatio = mWidth / mHeight;
                    let cw = imgRatio > targetRatio ? mWidth : mHeight * targetRatio;
                    let ch = imgRatio > targetRatio ? mWidth / targetRatio : mHeight;

                    canvas.width = Math.max(1080, Math.round(cw));
                    canvas.height = Math.max(1920, Math.round(ch));
                } else {
                    canvas.width = mWidth;
                    canvas.height = mHeight;
                }

                w = canvas.width;
                h = canvas.height;

                ctx.save();
                ctx.clearRect(0, 0, w, h);

                // 2. Draw Natural Blending Canvas Background Fill
                if (outputSize === 'ig' || outputSize === 'ig-reel') {
                    if (backgroundStyle === 'blur') {
                        ctx.save();
                        ctx.filter = 'blur(45px) brightness(0.65)';
                        const coverScale = Math.max(w / mWidth, h / mHeight);
                        const bgW = mWidth * coverScale;
                        const bgH = mHeight * coverScale;
                        ctx.drawImage(imageObj, (w - bgW) / 2, (h - bgH) / 2, bgW, bgH);
                        ctx.restore();

                        ctx.fillStyle = 'rgba(10, 14, 23, 0.25)';
                        ctx.fillRect(0, 0, w, h);
                    } else if (backgroundStyle === 'dark') {
                        ctx.fillStyle = '#0B1323';
                        ctx.fillRect(0, 0, w, h);
                    } else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, w, h);
                    }

                    const scaleFit = Math.min(w / mWidth, h / mHeight);
                    imgW = mWidth * scaleFit;
                    imgH = mHeight * scaleFit;
                    imgX = (w - imgW) / 2;
                    imgY = (h - imgH) / 2;
                    
                    ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.35)';
                    ctx.shadowBlur = isRecording ? 0 : w * 0.02;
                    ctx.shadowOffsetY = isRecording ? 0 : w * 0.006;
                    ctx.drawImage(imageObj, imgX, imgY, imgW, imgH);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                } else {
                    imgW = w; imgH = h;
                    ctx.drawImage(imageObj, 0, 0, w, h);
                }

                const isReel = outputSize === 'ig-reel';
                const refW = w; // Unified to canvas frame width for 100% layout consistency

                // 3. Overlay Box Settings (Symphonic Blue #102e5a)
                const cardMargin = refW * 0.025;
                const paddingX = refW * 0.035;
                const paddingY = refW * 0.022;

                const titleFontSize = refW * 0.028 * fontScale;
                const infoFontSize = refW * 0.022 * fontScale;
                const lineSpacing = refW * 0.006 * fontScale;

                let totalTextHeight = 0;
                if (eventName) totalTextHeight += titleFontSize;
                
                const equipmentText = (camera && lens) ? `${camera} + ${lens}` : (camera || lens || '');
                if (equipmentText) totalTextHeight += (eventName ? lineSpacing * 1.5 : 0) + infoFontSize;

                const locationDisplay = [venue, seating].filter(Boolean).join(' | ');
                if (locationDisplay) totalTextHeight += infoFontSize + lineSpacing;

                if (optionalText) totalTextHeight += infoFontSize + lineSpacing;

                const cardHeight = totalTextHeight + paddingY * 2;
                const bottomPadding = isReel ? (120 * (w / 1080)) : cardMargin;
                let cardX = cardMargin;
                let cardY = h - bottomPadding - cardHeight;
                let cardW = w - (cardMargin * 2);

                const cornerRadius = refW * 0.01;

                // Render Symphonic Blue Overlay Bar (#102e5a)
                ctx.save();
                ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = isRecording ? 0 : refW * 0.015;
                ctx.shadowOffsetY = isRecording ? 0 : refW * 0.005;

                drawRoundedRect(ctx, cardX, cardY, cardW, cardHeight, cornerRadius);
                ctx.fillStyle = hexToRgba('#102e5a', 0.92);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                ctx.lineWidth = Math.max(1, refW * 0.001);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.stroke();
                ctx.restore();

                // --- Render Clean Text ---
                ctx.save();
                ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = isRecording ? 0 : refW * 0.003;
                ctx.textAlign = 'left';

                let currentY = cardY + paddingY + (eventName ? titleFontSize * 0.8 : infoFontSize * 0.8);
                const textDrawX = cardX + paddingX;

                if (eventName) {
                    ctx.font = `800 ${titleFontSize}px ${fontFamily}`;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(eventName, textDrawX, currentY);
                    currentY += infoFontSize + lineSpacing * 1.4;
                }

                if (equipmentText) {
                    ctx.font = `600 ${infoFontSize}px ${fontFamily}`;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                    ctx.fillText(equipmentText, textDrawX, currentY);
                    currentY += infoFontSize + lineSpacing;
                }

                if (locationDisplay) {
                    ctx.font = `400 ${infoFontSize}px ${fontFamily}`;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
                    ctx.fillText(locationDisplay, textDrawX, currentY);
                    currentY += infoFontSize + lineSpacing;
                }

                if (optionalText) {
                    ctx.font = `400 ${infoFontSize * 0.9}px ${fontFamily}`;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fillText(optionalText, textDrawX, currentY);
                }
                ctx.restore();

                // 4. Standalone Floating QR Code Badge
                if (enableQr && qrObj) {
                    const qrBoxW = refW * qrSize; 
                    const qrPadding = qrBoxW * 0.08;
                    const qrImgSize = qrBoxW - qrPadding * 2;
                    
                    const textFontSize = qrBoxW * 0.11; 
                    const verticalGap = qrBoxW * 0.08; 
                    const textSpace = qrText ? (textFontSize + verticalGap) : 0;
                    const qrBoxH = qrPadding * 2 + qrImgSize + textSpace;

                    const padding = isReel ? 75 * (w / 1080) : cardMargin;
                    const boundX = 0;
                    const boundY = 0;
                    const boundW = w;

                    let qx, qy;
                    switch (qrPosition) {
                        case 'top-left':
                            qx = boundX + padding;
                            qy = boundY + padding;
                            break;
                        case 'top-right':
                            qx = boundX + boundW - qrBoxW - padding;
                            qy = boundY + padding;
                            break;
                        case 'bottom-left':
                            qx = boundX + padding;
                            qy = cardY - qrBoxH - padding;
                            break;
                        case 'bottom-right':
                            qx = boundX + boundW - qrBoxW - padding;
                            qy = cardY - qrBoxH - padding;
                            break;
                        default:
                            qx = boundX + boundW - qrBoxW - padding;
                            qy = boundY + padding;
                    }

                    if (logoObj) {
                        const logoMaxH = refW * 0.10; 
                        if ((qrPosition === 'top-right' && logoPosition === 'top-right') || 
                            (qrPosition === 'top-left' && logoPosition === 'top-left')) {
                            qy += logoMaxH + padding;
                        }
                    }

                    ctx.save();
                    ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.25)';
                    ctx.shadowBlur = isRecording ? 0 : refW * 0.012;
                    ctx.shadowOffsetY = isRecording ? 0 : refW * 0.004;

                    drawRoundedRect(ctx, qx, qy, qrBoxW, qrBoxH, qrBoxW * 0.06);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;

                    ctx.lineWidth = Math.max(1, refW * 0.001);
                    ctx.strokeStyle = 'rgba(16, 46, 90, 0.15)';
                    ctx.stroke();

                    ctx.drawImage(qrObj, qx + qrPadding, qy + qrPadding, qrImgSize, qrImgSize);

                    if (qrText) {
                        ctx.font = `800 ${textFontSize}px ${fontFamily}`;
                        ctx.fillStyle = '#102e5a';
                        ctx.textAlign = 'center';
                        ctx.fillText(qrText, qx + qrBoxW / 2, qy + qrPadding + qrImgSize + verticalGap + textFontSize * 0.85);
                    }

                    ctx.restore();
                }

                // 5. Bigger Custom Logo Overlay
                if (logoObj) {
                    const logoMaxW = refW * 0.28; 
                    const logoMaxH = refW * 0.10; 
                    let logoW = logoObj.width;
                    let logoH = logoObj.height;
                    
                    const scale = Math.min(logoMaxW / logoW, logoMaxH / logoH);
                    logoW = logoW * scale;
                    logoH = logoH * scale;

                    const pad = isReel ? 75 * (w / 1080) : cardMargin;
                    let logoX = logoPosition === 'top-left' ? pad : w - logoW - pad;
                    let logoY = pad;

                    ctx.save();
                    ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.25)';
                    ctx.shadowBlur = isRecording ? 0 : refW * 0.008;
                    ctx.drawImage(logoObj, logoX, logoY, logoW, logoH);
                    ctx.restore();
                }

                // 6. Seating Plan Overlay
                if (seatingPlanObj) {
                    const spMaxW = refW * 0.22; 
                    const spMaxH = h * 0.16; 
                    
                    let spW = seatingPlanObj.width;
                    let spH = seatingPlanObj.height;
                    const spScale = Math.min(spMaxW / spW, spMaxH / spH);
                    spW = spW * spScale;
                    spH = spH * spScale;

                    const pad = isReel ? 75 * (w / 1080) : cardMargin;
                    let spX = w - spW - pad;
                    let spY = cardY - spH - refW * 0.015;

                    ctx.save();
                    const spPadding = refW * 0.006;
                    ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = isRecording ? 0 : refW * 0.01;
                    
                    drawRoundedRect(ctx, spX - spPadding, spY - spPadding, spW + spPadding * 2, spH + spPadding * 2, refW * 0.006);
                    ctx.fillStyle = 'rgba(17, 19, 24, 0.85)';
                    ctx.fill();
                    ctx.lineWidth = Math.max(1, refW * 0.001);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.stroke();

                    ctx.drawImage(seatingPlanObj, spX, spY, spW, spH);
                    
                    if (pinPosition) {
                        const pinX = spX + (pinPosition.x * spW);
                        const pinY = spY + (pinPosition.y * spH);
                        
                        ctx.translate(pinX, pinY);
                        const pinScale = refW * 0.0016; 
                        ctx.scale(pinScale, pinScale);
                        ctx.translate(-12, -22); 
                        
                        const pinPath = new Path2D("M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z");
                        ctx.lineWidth = 1.5 / pinScale; 
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.stroke(pinPath);
                        ctx.fillStyle = '#DC2626'; 
                        ctx.fill(pinPath);
                    }
                    ctx.restore();
                }

                // 7. Detail Loupe Zoom Overlay
                if (enableZoom && mainImagePin) {
                    const insetSize = refW * zoomSize; 
                    const baseCropReference = refW * 0.25; 
                    
                    const px = mainImagePin.x * mWidth;
                    const py = mainImagePin.y * mHeight;
                    
                    const sWidth = baseCropReference / zoomLevel;
                    const sHeight = baseCropReference / zoomLevel; 
                    
                    let sx = Math.max(0, Math.min(px - (sWidth / 2), mWidth - sWidth));
                    let sy = Math.max(0, Math.min(py - (sHeight / 2), mHeight - sHeight));

                    let dx, dy;
                    const padding = isReel ? 75 * (w / 1080) : cardMargin;
                    const boundX = 0;
                    const boundY = 0;
                    const boundW = w;
                    
                    switch (zoomPosition) {
                        case 'top-left': dx = boundX + padding; dy = boundY + padding; break;
                        case 'top-right': dx = boundX + boundW - insetSize - padding; dy = boundY + padding; break;
                        case 'bottom-left': dx = boundX + padding; dy = cardY - insetSize - padding; break;
                        case 'bottom-right': dx = boundX + boundW - insetSize - padding; dy = cardY - insetSize - padding; break;
                        default: dx = boundX + padding; dy = boundY + padding;
                    }

                    if (logoObj) {
                        const logoMaxH = refW * 0.10; 
                        if ((zoomPosition === 'top-right' && logoPosition === 'top-right') || (zoomPosition === 'top-left' && logoPosition === 'top-left')) {
                            dy += logoMaxH + padding;
                        }
                    }

                    ctx.save();
                    ctx.shadowColor = isRecording ? 'transparent' : 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = isRecording ? 0 : refW * 0.012;

                    ctx.beginPath();
                    ctx.arc(dx + insetSize/2, dy + insetSize/2, insetSize/2, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                    
                    ctx.clip();
                    ctx.drawImage(imageObj, sx, sy, sWidth, sHeight, dx, dy, insetSize, insetSize);
                    
                    ctx.restore();
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(dx + insetSize/2, dy + insetSize/2, insetSize/2, 0, Math.PI * 2);
                    ctx.lineWidth = Math.max(2, refW * 0.003);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.stroke();
                    ctx.restore();
                    
                    const badgeW = refW * 0.11;
                    const badgeH = refW * 0.026;
                    const badgeX = dx + insetSize/2 - badgeW/2;
                    const badgeY = dy + insetSize - badgeH / 2;

                    ctx.save();
                    drawRoundedRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH/2);
                    ctx.fillStyle = 'rgba(17, 19, 24, 0.9)';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.stroke();

                    ctx.font = `700 ${refW * 0.012}px ${fontFamily}`;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${zoomLevel}x 局部放大`, dx + insetSize/2, badgeY + badgeH * 0.68);
                    ctx.restore();
                }

                // 8. IG Reels Safe Zone Guidelines
                if (showSafeZone && isReel && !isRecording) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
                    ctx.lineWidth = w * 0.003;
                    ctx.setLineDash([10, 10]);
                    
                    const topMargin = 120 * (w / 1080);
                    const bottomMargin = 280 * (w / 1080);
                    const rightMargin = 140 * (w / 1080);

                    ctx.beginPath();
                    ctx.moveTo(0, topMargin); ctx.lineTo(w, topMargin);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, h - bottomMargin); ctx.lineTo(w, h - bottomMargin);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(w - rightMargin, topMargin); ctx.lineTo(w - rightMargin, h - bottomMargin);
                    ctx.stroke();

                    ctx.font = `600 ${w * 0.02}px sans-serif`;
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                    ctx.fillText('IG Reels 安全區', 20, topMargin - 15);
                    ctx.restore();

                if (enableQr && qrUrl) {

            // REFACTORED VIDEO DOWNLOAD ENGINE FOR MP4 OUTPUT
            const downloadMedia = async () => {
                if (!canvasRef.current || !imageObj) return;

                if (mediaType === 'image') {
                    const dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.95);
                    const link = document.createElement('a');
                    link.download = 'watermarked_photo.jpg';

                        return;
                    }

                    setIsRecording(true);
                    setRecordingProgress(0);

                    // 1. Pause and reset video position cleanly
                    imageObj.pause();
                    imageObj.currentTime = 0;
                    
                    // Wait for seeked event to ensure frame 0 is rendered
                    await new Promise(resolve => {
                        const onSeeked = () => {
                            imageObj.removeEventListener('seeked', onSeeked);
                            resolve();
                        };

                        setTimeout(resolve, 300); // Fallback

                    const canvasStream = canvas.captureStream(30);
                    const tracks = [...canvasStream.getVideoTracks()];

                    // 3. Extract Audio Track directly from video if available
                    let videoAudioStream = null;
                    if (imageObj.captureStream) {
                        videoAudioStream = imageObj.captureStream();
                    } else if (imageObj.mozCaptureStream) {
                        videoAudioStream = imageObj.mozCaptureStream();
                    }

                    if (videoAudioStream) {
                        const audioTracks = videoAudioStream.getAudioTracks();
                        if (audioTracks.length > 0) {
                            tracks.push(audioTracks[0]);
                        }
                    }

                    const combinedStream = new MediaStream(tracks);

                    // 4. Select MP4 MIME Type (With WebM fallback for un-supported browsers)
                    const types = [
                        'video/mp4;codecs=avc1,mp4a.40.2',
                        'video/mp4;codecs=avc1',
                        'video/mp4;codecs=h264',
                        'video/mp4',
                        'video/webm;codecs=vp9,opus',
                        'video/webm;codecs=vp8,opus',
                        'video/webm'
                    ];

                    let selectedMime = '';
                    let fileExt = 'mp4';
                    for (const t of types) {

                            selectedMime = t;
                            fileExt = t.includes('mp4') ? 'mp4' : 'webm';

                        }

                    const dynamicBitrate = Math.round((totalPixels / 2073600) * 12000000);

                    imageObj.loop = false;

                        if (imageObj.ended || (duration > 0 && imageObj.currentTime >= duration)) {

                        }

                                    {seatingPlanSrc && (
                                        <div className="bg-black/40 p-3 rounded-lg border border-white/10 text-center space-y-2">
                                            <span className="text-[10px] text-gray-400">點擊地圖以標記座位位置</span>
                                            <div className="relative inline-block border border-white/20 rounded overflow-hidden">
                                                <img 
                                                    src={seatingPlanSrc} alt="Seating Plan" 
                                                    className="max-h-36 object-contain cursor-crosshair" 
                                                    onClick={handleSeatingPlanClick}
                                                />
                                                {pinPosition && (
                                                    <div 
                                                        className="absolute w-4 h-4 text-red-500 pointer-events-none transform -translate-x-1/2 -translate-y-full"
                                                        style={{ left: `${pinPosition.x * 100}%`, top: `${pinPosition.y * 100}%` }}
                                                    >
                                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                                    </div>
                                                )}
                                            </div>
                                            <button onClick={clearSeatingPlan} className="text-[10px] text-red-400 hover:underline block w-full">移除座位圖</button>
                                        </div>
                                    )}
                                </div>

                                <hr className="border-white/5" />

                                {/* SECTION 6: Caption Generator */}
                                <div className="space-y-3">
                                    <h2 className="text-xs font-bold uppercase tracking-wider text-blue-400">6. Instagram 貼文內文</h2>
                                    <textarea 
                                        readOnly 
                                        value={getGeneratedCaption()} 
                                        className="w-full h-28 bg-black/50 border border-white/10 rounded-lg p-3 text-xs text-gray-300 font-mono resize-none outline-none"
                                    />
                                    <button 
                                        onClick={copyCaptionToClipboard}
                                        className={`w-full py-2 rounded-lg font-bold text-xs transition ${copied ? 'bg-emerald-600 text-white' : 'bg-blue-600 hover:bg-blue-500 text-white'}`}
                                    >
                                        {copied ? '已複製貼文內容！ ✓' : '複製貼文內文'}
                                    </button>
                                </div>

                            </div>
                        </div>

                        {/* Right Live Viewport */}
                        <div className="flex-1 canvas-viewport flex flex-col items-center justify-center p-6 relative overflow-hidden">
                            {!imageObj && (
                                <div className="text-center space-y-2 max-w-sm">
                                    <div className="w-12 h-12 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center mx-auto text-gray-400">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                    </div>
                                    <h3 className="text-xs font-semibold text-gray-300 uppercase tracking-wider">尚未載入媒體</h3>
                                    <p className="text-[11px] text-gray-500">請從左側選單上載相片或影片以開始合成水印。</p>
                                </div>
                            )}

                            <canvas 
                                ref={canvasRef} 
                                onClick={handleCanvasClick}
                                className={`max-w-full max-h-[82vh] object-contain rounded-lg shadow-2xl transition-all duration-200 outline-none ${enableZoom ? 'cursor-crosshair' : 'cursor-default'}`}
                                style={{ display: imageObj ? 'block' : 'none' }}
                            />
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
