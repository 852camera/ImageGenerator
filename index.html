:root{color-scheme:dark;--bg:#10131a;--panel:#191e27;--panel-raised:#222a36;--field:#111720;--line:#303a49;--line-soft:#28313e;--text:#f0f3f8;--muted:#b2bdce;--subtle:#96a5ba;--navy:#0f2f5d;--accent:#96bce9;--accent-strong:#b4d2f6;--danger:#ffb1ad;--success:#99d8bb;--header-height:80px;font-family:'Studio Sans','Studio Emoji','Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-synthesis:weight style}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled,input:disabled,select:disabled{cursor:not-allowed;opacity:.45}button{color:inherit}input,textarea{caret-color:var(--accent-strong)}::selection{background:#355b88;color:#fff}:focus-visible{outline:2px solid var(--accent-strong);outline-offset:3px}button:focus:not(:focus-visible){outline:none}a{color:var(--accent)}svg{flex-shrink:0;vertical-align:middle}h1,h2,h3,p{margin:0}input[type=checkbox]{accent-color:#568bc8;width:16px;height:16px;flex-shrink:0}input[type=number]{font-variant-numeric:tabular-nums}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border-radius:8px;background:#47566a}::-webkit-scrollbar-thumb:hover{background:#647b98}button,input,select,textarea{transition:border-color .14s ease,background-color .14s ease,box-shadow .14s ease}button{touch-action:manipulation}button span{min-width:0}

.workbench{display:flex;flex:1;min-height:0;min-width:0}.control-panel{flex:0 0 366px;min-width:0;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:10}.panel-tabs{display:grid;grid-template-columns:repeat(4,1fr);height:61px;flex-shrink:0;border-bottom:1px solid var(--line);padding:0 12px;background:var(--panel);gap:3px}.panel-tabs button{background:none;border:0;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:500;color:var(--subtle);position:relative;padding:0 6px}.panel-tabs button:hover{color:var(--text)}.panel-tabs button.active{color:#e5efff}.panel-tabs button.active:after{content:'';position:absolute;bottom:-1px;left:10px;right:10px;height:2px;background:var(--accent);border-radius:1px}.panel-body{overflow-y:auto;overscroll-behavior:contain;padding:0 22px 20px;flex:1;animation:panel-enter .16s cubic-bezier(.16,1,.3,1)}@keyframes panel-enter{from{opacity:.82;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}.editor-fields{border:0;margin:0;padding:0;min-width:0}.control-section{padding:23px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:15px}.control-section:last-child{border-bottom:0}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-heading h2{font-size:13px;font-weight:600;letter-spacing:.02em}.section-note{font-size:11px;line-height:1.8;color:var(--subtle);margin-top:-7px}.count,.tag{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.tag{padding:3px 7px;border-radius:4px;background:#2d3748}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field>label,.field-caption,.range-caption>label{font-size:11px;font-weight:450;color:var(--muted);line-height:1.5}.field-caption{display:flex;justify-content:space-between}.field-caption>span{font-size:10px;color:var(--subtle)}input[type=text],input[type=number],textarea,select{color:var(--text);background:v
